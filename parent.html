<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF7F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171412" media="(prefers-color-scheme: dark)">
<title>保護者の方へ｜保育ナビ（仮）</title>
<meta name="description" content="入園の申し込み、保育料、子育ての支援など、保護者向けの公式資料と、案内役ひなたへの質問。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-aud="parent">
<div class="wrap">
<header class="topbar">
  <a class="brand" href="./"><span class="brand-mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V8l8-5 8 5v11"/><path d="M9 19v-5h6v5"/></svg></span>保育ナビ<small style="font-weight:500;color:var(--sub);font-size:.75rem">（仮）</small></a>
  <nav class="nav" aria-label="ページ">
    <a href="parent.html" aria-current="page">保護者の方</a>
    <a href="staff.html">保育者の方</a>
    <a href="facilities.html">施設をさがす</a>
  </nav>
</header>

<main>
  <section class="hero">
    <span class="eyebrow">保護者の方へ</span>
    <h1>入園・保育料・子育ての支援</h1>
    <p class="lead">市や国の資料から、保護者向けのものを集めました。わからないことは、案内役の「ひなた」に聞いてみてください。</p>
  </section>
  <div id="setup" class="setup" hidden></div>
  <section class="ask" id="ask"></section>
  
  <section class="section">
    <h2>保護者向けの資料</h2>
    <p class="note">国・県・市の資料のうち、保護者向けのものです。「元の資料を開く」で、公式のページやPDFが開きます。</p>
    <div id="docs"><div class="empty">読みこみ中…</div></div>
  </section>
</main>
<p class="foot">国・県・市が公開している資料をもとにした、見本のサイトです。最新の情報は、市や各園で確かめてください。</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="assets/app.js"></script>
<script>
(async () => {
  Hoiku.setupAsk(document.getElementById("ask"), "parent");
  const docsEl = document.getElementById("docs");
  if (!Hoiku.ready()) { Hoiku.showSetup(document.getElementById("setup")); docsEl.innerHTML = ""; return; }
  try {
    const docs = (await Hoiku.fetchDocs()).filter((d) => d.visibility === "public" && d.audience !== "staff");
    Hoiku.renderDocList(docsEl, docs, { q: new URLSearchParams(location.search).get("q") || "" });
  } catch (e) {
    console.error(e);
    docsEl.innerHTML = '<div class="empty">資料を読みこめませんでした。時間をおいて開き直してください。</div>';
  }
})();
</script>
</body>
</html>
